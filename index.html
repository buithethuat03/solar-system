<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D Solar System — Interactive Orrery</title>
  <meta name="description" content="An interactive, scientifically grounded 3D model of the Solar System built with three.js." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='40%25' cy='38%25' r='65%25'%3E%3Cstop offset='0' stop-color='%23fff6d6'/%3E%3Cstop offset='0.5' stop-color='%23ffb43c'/%3E%3Cstop offset='1' stop-color='%23ff6a00'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='11' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "three/addons/": "./lib/addons/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D canvas -->
  <canvas id="scene"></canvas>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-box">
      <div class="loading-sun"></div>
      <h1>SOLAR SYSTEM</h1>
      <p id="loading-text" data-i18n="loadingTextures">Loading textures…</p>
      <div class="loading-track"><div id="loading-bar"></div></div>
    </div>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">☀</span>
      <div>
        <div class="brand-title" data-i18n="brandTitle">SOLAR SYSTEM</div>
        <div class="brand-sub" data-i18n="brandSub">Interactive 3D Orrery</div>
      </div>
    </div>
    <div id="hud">
      <span id="hud-live"></span>
      <span id="hud-follow"></span>
      <span id="hud-fps"></span>
      <button id="btn-eclipse" class="ghost-btn" data-i18n="btnEclipses" data-i18n-title="eclipsesTitle" title="Eclipse views">🌒 Eclipses</button>
      <button id="btn-view" class="ghost-btn" data-i18n="btnView" data-i18n-title="viewTitle" title="View options">⚙ View</button>
      <button id="btn-share" class="ghost-btn" data-i18n-title="shareTitle" data-i18n-label="share" title="Share"><span class="btn-ico" aria-hidden="true">🔗</span><span class="btn-more-label" data-i18n="share">Share</span></button>
      <button id="btn-shot" class="ghost-btn" data-i18n-title="screenshotTitle" data-i18n-label="screenshot" title="Screenshot"><span class="btn-ico" aria-hidden="true">📷</span><span class="btn-more-label" data-i18n="screenshot">Screenshot</span></button>
      <button id="btn-help" class="ghost-btn" data-i18n="btnHelp" data-i18n-title="helpTitle2" title="Help">? Help</button>
      <button id="btn-reset-view" class="ghost-btn" data-i18n="btnReset" data-i18n-title="resetTitle" title="Reset camera">⟲ Reset view</button>
      <button id="btn-more" class="ghost-btn" hidden aria-haspopup="true" aria-expanded="false" data-i18n-label="moreActions" aria-label="More actions">⋯</button>
    </div>
  </header>

  <!-- Overflow menu for the topbar actions on narrow screens -->
  <div id="more-menu" class="hidden"></div>

  <!-- Left: body navigator -->
  <aside id="nav-panel" aria-label="Body navigator">
    <div class="panel-head">
      <span data-i18n="explore">EXPLORE</span>
      <button id="btn-nav-toggle" class="icon-btn" data-i18n-title="collapse" title="Collapse">≡</button>
    </div>
    <div id="body-list"></div>
  </aside>

  <!-- Eclipse chooser popover -->
  <div id="eclipse-menu" class="hidden">
    <button id="ecl-go-solar" class="ecl-choice">
      <span class="ecl-ico">🌑</span>
      <span><b data-i18n="eclSolarTitle">Solar Eclipse</b><small data-i18n="eclSolarSub">The Moon hides the Sun</small></span>
    </button>
    <button id="ecl-go-lunar" class="ecl-choice">
      <span class="ecl-ico">🔴</span>
      <span><b data-i18n="eclLunarTitle">Lunar Eclipse</b><small data-i18n="eclLunarSub">Earth's shadow on the Moon</small></span>
    </button>
  </div>

  <!-- Top-right: view options (popover) -->
  <aside id="toggles" class="hidden">
    <div class="panel-head"><span data-i18n="viewOptions">VIEW OPTIONS</span></div>
    <label class="switch"><input type="checkbox" id="tg-orbits" /> <span data-i18n="tgOrbits">Orbit paths</span></label>
    <label class="switch"><input type="checkbox" id="tg-labels" /> <span data-i18n="tgLabels">Labels</span></label>
    <label class="switch"><input type="checkbox" id="tg-moons" /> <span data-i18n="tgMoons">Moons</span></label>
    <label class="switch"><input type="checkbox" id="tg-dwarfs" /> <span data-i18n="tgDwarfs">Dwarf planets</span></label>
    <label class="switch"><input type="checkbox" id="tg-spacecraft" /> <span data-i18n="tgSpacecraft">Spacecraft (Voyagers)</span></label>
    <label class="switch"><input type="checkbox" id="tg-black-holes" /> <span data-i18n="tgBlackHoles">Black holes</span></label>
    <label class="switch"><input type="checkbox" id="tg-belts" /> <span data-i18n="tgBelts">Asteroid & Kuiper belts</span></label>
    <label class="switch"><input type="checkbox" id="tg-bloom" /> <span data-i18n="tgBloom">Sun glow (bloom)</span></label>
    <label class="switch"><input type="checkbox" id="tg-fullscreen" /> <span data-i18n="tgFullscreen">Fullscreen</span></label>
    <div class="select-row">
      <span data-i18n="distScale">Distance scale</span>
      <select id="dist-mode">
        <option value="visual" data-i18n="distVisual">Compressed (visible)</option>
        <option value="realistic" data-i18n="distRealistic">Realistic (to scale)</option>
        <option value="accurate" data-i18n="distAccurate">Accurate · live (true positions)</option>
      </select>
      <div class="hint" id="dist-hint"></div>
    </div>
    <div class="select-row">
      <span data-i18n="texQuality">Texture quality</span>
      <select id="tex-res">
        <option value="2k" data-i18n="tex2k">2K · standard</option>
        <option value="8k" data-i18n="tex8k">8K · high-res</option>
      </select>
    </div>
    <div class="select-row">
      <span data-i18n="language">Language</span>
      <select id="lang-sel">
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </div>
  </aside>

  <!-- Right: info panel -->
  <aside id="info-panel" class="hidden" role="region" aria-live="polite" aria-labelledby="info-name">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="info-head">
      <div class="info-titles">
        <h2 id="info-name">—</h2>
        <div id="info-type" class="info-type"></div>
      </div>
      <div class="info-actions">
        <button id="btn-info-toggle" class="icon-btn" data-i18n-title="collapse" title="Collapse">▾</button>
        <button id="btn-focus" class="accent-btn" data-i18n="focusFollow">⌖ Focus &amp; follow</button>
      </div>
    </div>
    <p id="info-desc"></p>
    <div id="info-table"></div>
    <div id="info-facts-wrap">
      <h3 data-i18n="didYouKnow">Did you know?</h3>
      <ul id="info-facts"></ul>
    </div>
  </aside>

  <!-- Bottom: time controls -->
  <footer id="time-bar">
    <div class="time-left">
      <button id="btn-play" class="round-btn">❚❚</button>
      <button id="btn-reverse" class="round-btn small" data-i18n-title="reverseTitle" title="Reverse time">◄◄</button>
      <button id="btn-now" class="ghost-btn" data-i18n="now" data-i18n-title="nowTitle" title="Jump to current date">Now</button>
    </div>
    <div class="time-mid">
      <input type="range" id="speed-slider" />
      <div class="time-readouts">
        <span id="speed-readout">—</span>
        <span class="dot">•</span>
        <span id="sim-date">—</span>
      </div>
      <div id="speed-presets"></div>
    </div>
    <div class="time-right">
      <label class="date-pick"><span class="date-label" data-i18n="goToDate">Go to date</span>
        <span class="date-ico" aria-hidden="true">📅</span>
        <input type="date" id="date-input" />
      </label>
    </div>
  </footer>

  <!-- Help panel -->
  <div id="help-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-card">
      <button id="btn-help-close" class="icon-btn close" data-i18n-label="close" aria-label="Close">✕</button>
      <h2 id="help-title" data-i18n="helpHowTo">How to use</h2>
      <ul data-i18n-list="help"></ul>
      <h3 data-i18n="helpAbout">About the model</h3>
      <p data-i18n-html="helpAboutText"></p>
      <p id="credits" data-i18n="credits"></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
